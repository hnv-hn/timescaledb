apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.3.0
    helm:
      values: |
        mode: standalone # WICHTIG: in Produktion solltest du den Modus "distributed" verwenden
        replicas: 1 # WICHTIG: in Produktion mindestens 4 Replikate
        buckets:
          - name: backups
            policy: none
            purge: false
        rootUser: admin
        rootPassword: password123 # ÄNDERE DAS SOFORT IN PRODUKTION (via Secret)
        persistence:
          size: 100Gi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: minio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
