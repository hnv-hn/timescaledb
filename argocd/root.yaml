apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: timescaledb-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hnv-hn/timescaledb.git
    path: argocd/applications
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true