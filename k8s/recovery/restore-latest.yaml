apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: timescale-restore-latest
  namespace: hetida-platform-dev
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16-ts

  bootstrap:
    recovery:
      source: timescaledb
      recoveryTarget:
        targetImmediate: true

  storage:
    size: 50Gi
    storageClass: longhorn

  externalClusters:
    - name: timescaledb
      barmanObjectStore:
        destinationPath: 's3://backups/timescaledb/'
        endpointURL: 'http://minio.minio-system.svc.cluster.local:9000'
        s3Credentials:
          accessKeyId:
            name: s3-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: s3-creds
            key: SECRET_ACCESS_KEY
