apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: timescale-restore-pitr
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16-ts
  bootstrap:
    recovery:
      source: timescale-cluster
      recoveryTarget:
        targetTime: '2026-05-06T02:30:00' # ANPASSEN
  storage:
    size: 50Gi
  externalClusters:
    - name: timescale-cluster
      barmanObjectStore:
        destinationPath: 's3://backups/'
        endpointURL: 'http://minio.minio-system.svc.cluster.local:9000'
        s3Credentials:
          accessKeyId:
            name: s3-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: s3-creds
            key: SECRET_ACCESS_KEY
