apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-backup-alert
spec:
  groups:
    - name: cnpg.backup.rules
      rules:
        - alert: CNPGBackupMissing
          expr: time() - cnpg_last_successful_backup_timestamp{cluster="timescaledb"} > 86400
          for: 10m
          labels:
            severity: critical
            team: platform
            alertmanager: enabled
          annotations:
            summary: 'CNPG backup missing'
            description: 'No successful backup for timescaledb in the last 24 hours.'

        - alert: CNPGBackupFailed
          expr: cnpg_last_failed_backup_timestamp{cluster="timescaledb"} > cnpg_last_successful_backup_timestamp{cluster="timescaledb"}
          for: 15m
          labels:
            severity: critical
            team: platform
            alertmanager: enabled
          annotations:
            summary: 'CNPG backup failed'
            description: 'Last backup attempt failed for timescaledb.'

        - alert: CNPGWalArchiveLag
          expr: cnpg_pg_wal_archive_status{cluster="timescaledb"} == 0
          for: 15m
          labels:
            severity: warning
            team: platform
            alertmanager: enabled
          annotations:
            summary: 'CNPG WAL archiving issue'
            description: 'WAL archiving may be stalled for timescaledb.'
